name: Build and Release

on:
  pull_request:
    branches: [ts]
  push:
    branches: [ts]
    tags: ["ts-v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # npm CLI ≥ 11.5.1 + Node ≥ 22.14 are required for automatic OIDC
          # token exchange with the trusted publisher (npm docs). Node 22
          # ships with npm 10.9; the `npm i -g npm@latest` step below bumps it.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      # `pnpm publish` doesn't do the npm trusted-publisher OIDC exchange
      # reliably (pnpm/pnpm#11513 — regression in 11.0.8; even post-fix the
      # code path is fragile). Provenance signing succeeds via sigstore, but
      # the actual `PUT /@scope/pkg` goes out unauthenticated and npm returns
      # a misleading 404. Using `npm publish` directly avoids the whole issue.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `--provenance` is technically optional now (npm CLI enables it by
      # default under trusted publishing) but keeping it explicit for clarity.
      - run: npm publish --provenance --access public
      - name: Get tag message
        id: tag
        run: |
          git fetch origin tag ${{ github.ref_name }} --force
          TAG_MSG=$(git tag -l --format='%(contents:body)' ${{ github.ref_name }})
          {
            echo "message<<EOF"
            echo "$TAG_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.tag.outputs.message }}
          generate_release_notes: true
